[project]
name = "xt"
version = "0.22.1rc4"
description = "Harness-agnostic hierarchical agent teams on top of Herdr"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "tomlkit>=0.13",
    "textual>=1.0",
]

[project.scripts]
xt = "xt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
