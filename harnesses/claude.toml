# Adapter: how xt starts an agent in Claude Code.
herdr_kind = "claude"
binary = "claude"
# Agents get no browser control (card #89): Claude in Chrome's tools are refused for xt's sessions.
# Other desktop skills weren't available to verify, so this is reported as partial.
args = ["--disallowedTools", "mcp__claude-in-chrome"]
desktop_tools = "partial"
desktop_tools_note = "Claude in Chrome tools refused for this session; other desktop or computer-use skills not verified"
# The operator's account connectors (card #101): claude.ai connectors (mail, drive, calendar…)
# and plugin or user MCP servers. --strict-mcp-config with no --mcp-config loads none of them
# (checked 2026-09-28: 87 tools with them, 24 without). An agent with `connectors = [...]` in
# team.toml gets only those servers: xt lists the others at start and refuses their tools.
connectors = "blocked"
connectors_note = "no MCP servers or claude.ai connectors unless opted in per agent; CLIs holding your credentials aren't covered"
connector_block_args = ["--strict-mcp-config"]
connector_style = "claude-mcp"
# Per-agent settings file (card #117): `permissions = "settings/<agent>.json"` in team.toml.
settings_flag = "--settings"
model_flag = "--model"
summary = "Claude Code: careful multi-step work and writing; reads repo skills via .claude/skills"
limits = [
  "Its pooled background command daemon can hand out stale HERDR_* env vars; xt never relies on them",
  "Permission prompts block the agent until answered (xt watch alerts); use your own allowlist/settings",
  "First start in a new folder asks whether you trust it; xt answers it",
]

# Context usage: message.usage per turn in the project's session log; the log doesn't state the
# model's window, so it comes from this table (checked with `claude -p --output-format json`).
sessions = "~/.claude/projects/*/*.jsonl"
session_format = "claude"

# Claude Code's folder-trust question on first start in a new directory (wording has varied
# between versions). "No, exit" is preselected, so move down to "Yes, I trust this folder" first.
[[startup_dialogs]]
name = "folder trust"
match = ["Do you trust the files in this folder?", "Is this a project you created or one you trust"]
keys = ["down", "enter"]

# Windows (checked 2026-09-29): the current models from https://platform.claude.com/docs/en/models/overview
# (Fable 5.1, Opus 5.5, Sonnet 5.5: 1M; Haiku 4.5: 200k); the legacy models it links (Fable 5, Opus 5,
# Opus 4.8/4.7/4.6, Sonnet 5, Sonnet 4.6) have 1M like every 4.6-and-later model. Haiku 4.5 logs its
# dated ID, so both spellings are listed. A model missing here shows no context percentage.
[context_windows]
"claude-fable-5-1" = 1000000
"claude-fable-5" = 1000000
"claude-opus-5-5" = 1000000
"claude-opus-5" = 1000000
"claude-opus-4-8" = 1000000
"claude-opus-4-7" = 1000000
"claude-opus-4-6" = 1000000
"claude-sonnet-5-5" = 1000000
"claude-sonnet-5" = 1000000
"claude-sonnet-4-6" = 1000000
"claude-haiku-4-5" = 200000
"claude-haiku-4-5-20251001" = 200000
