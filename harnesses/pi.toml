# Adapter: how xt starts an agent in pi.
herdr_kind = "pi"
binary = "pi"
# -a (--approve): trust project-local files for this run. Without it pi stops at a
# "Trust project folder?" dialog and ignores the repo's .agents/skills.
args = ["-a"]
desktop_tools = "none"
desktop_tools_note = "pi has no built-in desktop or browser tools (extensions could add some)"
connectors = "none"
connectors_note = "pi has no account connectors (extensions could add some); CLIs holding your credentials aren't covered"
model_flag = "--model"
summary = "pi: lightweight, many model providers; reads repo skills via .agents/skills"
# Card #186: pi has no permission system or sandbox. It enforces skills (`--no-skills`, then the
# team's skills and named ones with `--skill`) and has no account connectors; the rest is role text.
capabilities_checked = "pi 1.0.2 (operator check 2026-10-04: --help)"
limits = [
  "-a also trusts project .pi settings and extensions for the run: don't keep a .pi/ dir you don't mean",
]

# Context usage: usage per assistant message in the session log; windows from `pi --list-models`
# (cached by xt for a day), or this table ("provider/model" = tokens) to override.
sessions = "~/.pi/agent/sessions/*/*.jsonl"
session_format = "pi"

# pi has lost the first five characters of a first prompt on some first starts (card #167). xt
# waits until pi's screen has stayed unchanged for `ready_settle` checks (a second apart), then
# checks the session log for the prompt's opening (`check_prompt_in_log`). Waiting is not enough:
# rc3 lost five characters after a 3 s still screen, while a cold start captured on 2026-10-01
# lost none. So xt types `first_prompt_prefix` as the prompt's first line, and a lost start eats
# that line instead of the opening. A prompt still damaged is resent whole once, when the agent is
# idle, and a second failure raises the partprompt alert.
ready_settle = 3
check_prompt_in_log = true
first_prompt_prefix = "(xt: this line only guards your first prompt against lost characters; ignore it. The prompt follows.)"

# A pi agent ended a `done` with "No issues.", which the protocol forbids (card #180, seen once;
# Codex agents complied). The first prompt carries this line just before its last one, far from
# the guard line and the opening the log check reads.
first_prompt_note = "Reminder (protocol §4): add a `Friction:` line to a report or `done` only when something got in the way; otherwise write nothing about it, never \"no issues\" or \"no friction\"."

# Card #186: each capability on this harness (see capabilities_checked above).
[capabilities]
write = "advisory"
deny = "advisory"
commands = "advisory"
network = "advisory"
connectors = "enforced"
skills = "enforced"
credential_clis = "advisory"
