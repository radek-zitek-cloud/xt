# Adapter: how xt starts an agent in pi.
herdr_kind = "pi"
binary = "pi"
# -a (--approve): trust project-local files for this run. Without it pi stops at a
# "Trust project folder?" dialog and ignores the repo's .agents/skills.
args = ["-a"]
desktop_tools = "none"
desktop_tools_note = "pi has no built-in desktop or browser tools (extensions could add some)"
model_flag = "--model"
summary = "pi: lightweight, many model providers; reads repo skills via .agents/skills"
limits = [
  "-a also trusts project .pi settings and extensions for the run: don't keep a .pi/ dir you don't mean",
]

# Context usage: usage per assistant message in the session log; windows from `pi --list-models`
# (cached by xt for a day), or this table ("provider/model" = tokens) to override.
sessions = "~/.pi/agent/sessions/*/*.jsonl"
session_format = "pi"
