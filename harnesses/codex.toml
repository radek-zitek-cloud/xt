# Adapter: how xt starts an agent in the OpenAI Codex CLI.
herdr_kind = "codex"
binary = "codex"
# Agents get no desktop or browser control (card #89): the computer-use plugin's MCP server
# (cua_repl) is switched off for xt's sessions only, plus Codex's own browser and computer-use
# features. No quotes or braces, because Herdr types the command into a shell.
args = [
  "-c", "mcp_servers.cua_repl.command=/bin/true", "-c", "mcp_servers.cua_repl.enabled=false",
  "-c", "features.computer_use=false", "-c", "features.browser_use=false",
  "-c", "features.browser_use_external=false", "-c", "features.in_app_browser=false",
]
desktop_tools = "blocked"
desktop_tools_note = "computer-use server and browser features off for this session; checked 2026-09-28"
# The operator's account connectors (card #101): Codex "apps" (ChatGPT connectors such as
# Google Drive or Calendar) are switched off for xt's sessions (checked 2026-09-28: the installable
# apps and the plugin-install tool are gone). Codex can switch its apps back on only as a whole,
# not one by one, so a Codex agent takes no `connectors` opt-in: xt refuses to start it with one.
connectors = "blocked"
connectors_note = "apps (ChatGPT connectors) off; no per-agent opt-in, because Codex can't enable single apps; CLIs holding your credentials aren't covered"
connector_block_args = ["-c", "features.apps=false"]
model_flag = "--model"
summary = "OpenAI Codex CLI: recommended for the liaison and lead; reads repo skills via .agents/skills"
limits = [
  "Shell commands run through one shared machine-wide app-server daemon: per-pane env never reaches them",
  "Its sandbox makes ~/.cache read-only; bin/xt keeps uv's cache inside the repo",
  "First start in a new folder asks 'Trust this folder?' (not skippable with -c); xt answers it",
]

# Context usage: the session log's token_count events carry the latest turn's usage and the
# model's context window (the figure is the latest turn, so xt marks it approximate).
sessions = "~/.codex/sessions/*/*/*/rollout-*.jsonl"
session_format = "codex"

# Answered by xt before the first prompt. Running xt in a team repo is the human's consent to
# trust it; codex saves the decision itself. Without this, the first prompt is typed into the
# dialog and lost (it happened to the liaison in both of the first two real runs).
[[startup_dialogs]]
name = "folder trust"
match = "Trust this folder?"
keys = ["enter"]
