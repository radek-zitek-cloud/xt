# Public list prices in USD per million tokens, used only for estimates that xt always labels
# "est.". They are not what you pay on a subscription or a negotiated plan. A model that isn't
# listed here gets no estimate (its tokens are shown as unpriced), never a guess. pi reports its
# own cost per message and doesn't need an entry.
#
# Fields: input, cached_input (Codex), cache_write_5m / cache_write_1h / cache_read (Claude),
# output; plus where the price comes from, which price tier it is, and when it was checked.
#
# Tier: the provider's Standard API rates (not Batch, Flex, Fast or priority). OpenAI's page also
# lists higher long-context rates; xt always uses the short-context rates. That holds while a
# session's context stays below the provider's long-context threshold (OpenAI names 272K for
# gpt-5.5; the Codex sessions checked on 2026-09-29 logged a usable window of 258,400). A session
# past the threshold would be underestimated; xt doesn't switch rates.
# Claude 4.6 and later bill their whole 1M window at the standard rate. Actual billing (a
# subscription, a negotiated plan) isn't visible to xt: every figure is an estimate.

# --- Codex (OpenAI) ---

[models."gpt-6-astra"]
input = 10.00
cached_input = 1.00
output = 50.00
source = "https://developers.openai.com/api/docs/pricing"
tier = "standard, short context"
checked = 2026-09-29

